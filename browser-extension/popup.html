<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声迹</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="blsp-wrap">
    <header class="blsp-head">
      <img class="blsp-mark" src="logo.png" alt="声迹 Logo">
      <div><h1>声迹</h1><p>听见每一句，唱准每一拍</p></div>
    </header>
    <section class="blsp-guide">
      <h2>快速开始</h2>
      <ol>
        <li><b>1</b><span>进入 B站播放页，点击右侧“获取歌词”</span></li>
        <li><b>2</b><span>默认使用声迹服务同步 LRC，也可使用 B站字幕</span></li>
        <li><b>3</b><span>点击歌词逐句跳转、循环与标记掌握</span></li>
      </ol>
    </section>
    <section class="blsp-local"><strong>服务由维护者统一部署</strong><span>安装扩展后直接打开 B站播放页使用</span><code>遇到连接失败时，请稍后重试或联系维护者</code></section>
    <div class="blsp-keys"><span><kbd>R</kbd>重播</span><span><kbd>← →</kbd>切句</span><span><kbd>Space</kbd>播放</span></div>
    <p class="blsp-note">声迹服务会处理所选片段，并尝试匹配公开歌词；匹配失败时保留模型识别结果。</p>
  </main>
</body>
</html>
